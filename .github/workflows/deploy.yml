name: CI/CD — thht-27

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ci:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: go vet, go test, kiểm tra kiểu web
        run: make test

      # Build trên runner (7GB RAM, miễn phí) rồi chỉ chép kết quả sang VPS:
      # VPS dùng chung RAM với nhiều dịch vụ khác, build ở đó dễ chết giữa chừng.
      - name: Đóng gói release (Go linux/amd64 + web standalone)
        run: make release

      - name: Lưu release làm artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy lên VPS
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      # Chưa khai báo secrets thì bỏ qua deploy (không báo đỏ), chỉ để lại lời nhắc.
      - name: Kiểm tra secrets
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice::Chưa có secrets VPS_HOST / VPS_SSH_KEY – bỏ qua deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tải release đã build ở job ci
        if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Chép release sang VPS (thư mục tạm)
        if: steps.check.outputs.ok == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: release.tar.gz
          target: ${{ secrets.VPS_APP_PATH || '/root/thht-27' }}/.deploy-tmp

      - name: Cập nhật mã nguồn và khởi động lại bằng pm2
        if: steps.check.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH || '/root/thht-27' }}"
            git fetch origin main
            # Chỉ reset, KHÔNG `git clean`: .env và bin/ nằm trong .gitignore, phải được giữ lại.
            git reset --hard origin/main
            bash scripts/deploy-remote.sh .deploy-tmp/release.tar.gz
